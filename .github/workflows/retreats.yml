name: Update Jessica's retreats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'retreat-photos/**'

permissions:
  contents: write

concurrency:
  group: retreats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the photo shrinker
        run: npm install --no-save sharp
      - name: Read retreats from Cal.com
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        run: node scripts/update-retreats.mjs
      - name: Save if anything changed
        run: |
          set -x
          git config user.name "retreats-bot"
          git config user.email "retreats-bot@users.noreply.github.com"
          git add jessica-retreats.json retreat-photos
          # Ignore the "updated" timestamp so we only commit when the retreats really changed.
          if git diff --cached --quiet -I'"updated"'; then
            echo "No retreat changes to save."
            exit 0
          fi
          git commit -m "Update retreats and photos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
