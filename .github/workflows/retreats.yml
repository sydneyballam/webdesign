name: Update Jessica's retreats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retreats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read retreats from Cal.com
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
          CAL_USERNAME: ${{ vars.CAL_USERNAME }}
        run: node scripts/update-retreats.mjs
      - name: Save if anything changed
        run: |
          git diff --quiet -I'"updated"' jessica-retreats.json && exit 0
          git config user.name "retreats-bot"
          git config user.email "retreats-bot@users.noreply.github.com"
          git add jessica-retreats.json
          git commit -m "Update retreats from Cal.com"
          git push
