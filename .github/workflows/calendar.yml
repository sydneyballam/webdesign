name: Update community calendar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the date helper
        run: pip install python-dateutil
      - name: Build events and feeds from the public sheet tab
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          HOOPA_ICS_URL: ${{ secrets.HOOPA_ICS_URL }}
        run: python3 calendar/build.py
      - name: Save if anything changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar/events.json calendar/feeds
          if git diff --cached --quiet; then
            echo "No calendar changes to save."
            exit 0
          fi
          git commit -m "Update community calendar"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
