  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ly:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;line-height:1.1;margin:0}\n.eyebrow{font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-size:13px;line-height:1.3}\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:6px;font-weight:700;font-size:17px;text-decoration:none}\n.btn:hover{filter:brightness(0.93)}\n.btn-y{color:#1F2326}\n.btn-g{background:#006C4B;color:#fff}\n.btn-line{border:2px solid currentColor;background:transparent}\n.nav a{text-decoration:none;font-weight:600;font-size:16px;padding:10px 4px;color:#41454A}\n.nav a:hover{text-decoration:underline}\n.ph{background:repeating-linear-gradient(135deg,#C1D0C6 0,#C1D0C6 12px,#D4DFD8 12px,#D4DFD8 24px);color:#41454A;display:flex;align-items:flex-end;padding:14px;font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<a href=\"#main\" style=\"position:absolute;left:-9999px;top:0;background:#fff;color:#41454A;padding:12px 16px;z-index:10\">Skip to content<\u002Fa>\n\n<!-- HEADER -->\n<header style=\"background:#fff;border-bottom:1px solid #C1D0C6\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-top:14px;padding-bottom:14px\">\n<a href=\"https://wcfiresafe.org/\" aria-label=\"Willow Creek Fire Safe Council home\" style=\"display:block;line-height:0\">\n<img src=\"d9f1c596-2220-4386-8e95-53dd4de86a6b\" alt=\"Willow Creek Fire Safe Council logo\" style=\"width:96px;height:auto;display:block\">\n<\u002Fa>\n<nav class=\"nav\" aria-label=\"Main\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px\">\n<a href=\"https://wcfiresafe.org/chipper-program\">Chipper Program<\u002Fa>\n<a href=\"https://wcfiresafe.org/firewise-communities\">Firewise<\u002Fa>\n<a href=\"https://wcfiresafe.org/cwpp\">CWPP<\u002Fa>\n<a href=\"https://wcfiresafe.org/about\">About<\u002Fa>\n<a href=\"#events\">Events<\u002Fa>\n<a href=\"https://wcfiresafe.org/contact-us\">Contact<\u002Fa>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/donation-form/willow-creek-fire-safe-council-donation\" style=\"background:{{accent}};margin-left:6px;padding:0 22px;color:#1F2326\">Donate<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\">\n\n<!-- HERO -->\n<section style=\"background:#006C4B;color:#fff;overflow:hidden\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:40px 56px;padding-top:64px;padding-bottom:48px;align-items:center\">\n<div style=\"flex:1 1 520px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 18px;color:#fff\">Willow Creek, California · Serving since 2002<\u002Fp>\n<h1 class=\"disp\" style=\"font-size:clamp(34px,5vw,52px);color:#fff\">A fire safe Willow Creek starts at your driveway.<\u002Fh1>\n<p style=\"font-size:21px;max-width:560px;margin:24px 0 0;color:#E9F0EB\">We clear roadside fuels, assess homes for free, and help neighbors get ready, so the whole community is harder to burn and easier to leave.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:32px\">\n<a class=\"btn btn-y\" href=\"#assessment\" style=\"background:{{accent}}\">Get a free home assessment<\u002Fa>\n<a class=\"btn btn-line\" href=\"https://www.zeffy.com/en-US/ticketing/willow-creek-fire-safe-council-membership-drive\" style=\"color:#fff\">Join the council<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 340px;min-width:0;max-width:460px\">\n<div style=\"background:#fff;color:#41454A;border-radius:10px;padding:28px\">\n<p class=\"eyebrow\" style=\"margin:0 0 8px;color:#852428\">Before fire season, and during it<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:30px;margin-bottom:12px;color:#006C4B\">Know your evacuation zone<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:17px\">Look up your zone now. Then pick a meeting place and a second way out.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<a class=\"btn btn-g\" href=\"https://protect.genasys.com/search\" style=\"justify-content:space-between\">Humboldt County zones <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<a class=\"btn btn-g\" href=\"https://trinityfriends.maps.arcgis.com/apps/webappviewer/index.html?id=f4ba89983bba4e2aa3f0d608b30b4fb8\" style=\"justify-content:space-between\">Trinity County zones <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<!-- forest and mountains -->\n<svg sc-camel-view-box=\"0 0 1440 280\" sc-camel-preserve-aspect-ratio=\"xMidYMax slice\" width=\"100%\" height=\"260\" style=\"display:block;width:100%;height:clamp(150px,22vw,280px)\" aria-hidden=\"true\" focusable=\"false\">\n<defs>\n<path id=\"pine\" d=\"M0 -100 L18 -62 L9 -62 L26 -30 L12 -30 L32 0 L-32 0 L-12 -30 L-26 -30 L-9 -62 L-18 -62 Z\"><\u002Fpath>\n<\u002Fdefs>\n<circle cx=\"1090\" cy=\"120\" r=\"52\" fill=\"#FFB547\"><\u002Fcircle>\n<polygon fill=\"#C1D0C6\" opacity=\"0.4\" points=\"0,190 110,110 190,160 330,50 470,150 560,95 690,180 830,40 970,150 1090,85 1210,165 1330,95 1440,150 1440,280 0,280\"><\u002Fpolygon>\n<polygon fill=\"#00573C\" points=\"0,235 140,150 260,205 400,120 540,210 690,140 820,215 980,130 1120,205 1260,150 1440,215 1440,280 0,280\"><\u002Fpolygon>\n<g fill=\"#004D35\">\n<use href=\"#pine\" transform=\"translate(60 262) scale(0.8)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(170 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(300 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(420 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(540 262) scale(0.85)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(660 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(790 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(900 262) scale(0.75)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1030 262) scale(0.85)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1150 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1280 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1390 262) scale(0.75)\"><\u002Fuse>\n<\u002Fg>\n<g fill=\"#003A28\">\n<use href=\"#pine\" transform=\"translate(30 282) scale(1.9)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(125 282) scale(1.3)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(215 282) scale(1.6)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(335 282) scale(1.1)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(470 282) scale(1.5)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(565 282) scale(1.0)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(700 282) scale(1.7)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(805 282) scale(1.2)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(930 282) scale(1.9)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1040 282) scale(1.2)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1150 282) scale(1.6)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1260 282) scale(1.3)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1360 282) scale(1.8)\"><\u002Fuse>\n<use href=\"#pine\" transform=\"translate(1428 282) scale(1.2)\"><\u002Fuse>\n<\u002Fg>\n<rect x=\"0\" y=\"268\" width=\"1440\" height=\"12\" fill=\"#003A28\"><\u002Frect>\n<\u002Fsvg>\n<\u002Fsection>\n\n<!-- MISSION -->\n<section id=\"mission\" style=\"background:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:48px 64px;align-items:flex-start\">\n<div style=\"flex:1 1 380px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 14px;color:#852428\">Our mission<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);color:#006C4B;margin-bottom:24px\">To reduce wildfire risk and increase survivability.<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:20px\">We do that by implementing fuels reduction projects and encouraging residents of the Willow Creek area to make their homes, neighborhoods and communities fire safe.<\u002Fp>\n<p style=\"margin:0;font-size:16px\">Willow Creek Fire Safe Council is a California nonprofit public benefit corporation and a 501(c)(3) public charity.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 440px;min-width:0\">\n<h3 class=\"eyebrow\" style=\"margin:0 0 16px;color:#41454A\">What we work toward<\u002Fh3>\n<ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">A<\u002Fspan><span style=\"min-width:0\">Increase community awareness and understanding of both the benefits and threats of wildland fire<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">B<\u002Fspan><span style=\"min-width:0\">Educate residents on ways to protect their lives and property from loss to catastrophic wildland fire<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">C<\u002Fspan><span style=\"min-width:0\">Generate individual and community action to reduce wildfire hazards and plan for emergency response<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">D<\u002Fspan><span style=\"min-width:0\">Reduce wildfire hazards by removing flammable vegetation around homes and evacuation routes<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">E<\u002Fspan><span style=\"min-width:0\">Enhance communication between the public and federal, state, county and local agencies to identify and prioritize hazard reduction projects and co-ordinate community planning<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">F<\u002Fspan><span style=\"min-width:0\">Develop and monitor a Community Wildfire Protection Plan for the Willow Creek area to address hazard mitigation, community preparedness, structure protection and wildfire response<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6;border-bottom:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">G<\u002Fspan><span style=\"min-width:0\">Engage the youth of our communities in fire prevention by providing activities and educational opportunities related to fire safety and protecting natural resources<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WAYS WE HELP -->\n<section style=\"padding-top:72px;padding-bottom:24px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:32px;color:#006C4B\">Four ways to get ready this month<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Free home risk assessment<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Learn how to harden your home and what to clear within 100 feet.<\u002Fp>\n<a href=\"#assessment\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Sign up →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Chipper Program<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Members can have brush chipped from around their homes.<\u002Fp>\n<a href=\"https://wcfiresafe.org/chipper-program\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">How it works →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"#1D5FD1\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.5\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Blue Dot and address signs<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Mark your water source and your address so crews find you fast.<\u002Fp>\n<a href=\"#first-responders\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Get on the list →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Firewise Community<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Willow Creek holds Firewise certification. See what it means for you.<\u002Fp>\n<a href=\"https://wcfiresafe.org/firewise-communities\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Learn more →<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- EVENTS -->\n<section id=\"events\" style=\"padding-top:64px;padding-bottom:64px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:32px;color:#006C4B\">Meetings and events<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n\n<div style=\"flex:1 1 420px;min-width:0;background:#006C4B;color:#fff;border-radius:10px;padding:36px\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#fff\">Monthly board meeting · open to everyone<\u002Fp>\n<p class=\"disp\" style=\"font-size:40px;margin-bottom:6px\">Thu, Nov 5 · 6 pm<\u002Fp>\n<p style=\"margin:0 0 20px;color:#E9F0EB\">First Thursday of every month<\u002Fp>\n<p style=\"margin:0 0 4px;font-weight:700\">In person<\u002Fp>\n<p style=\"margin:0 0 20px;color:#E9F0EB\">40620 Hwy. 299, Willow Creek, CA 95573<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a class=\"btn btn-y\" href=\"https://us06web.zoom.us/j/86943975943?pwd=qamI5EEDfB6Nbn5HSbuJouliqQt7Yg.1#success\" style=\"background:{{accent}}\">Join by Zoom<\u002Fa>\n<a class=\"btn btn-line\" href=\"http://eepurl.com/iSznJk\" style=\"color:#fff\">Get an invite each month<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin:20px 0 0;color:#E9F0EB;font-size:16px\">Zoom meeting ID 869 4397 5943 · Passcode 712931<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n\n<div style=\"display:flex;gap:20px;background:#fff;border-radius:10px;padding:24px;align-items:flex-start\">\n<div style=\"flex:none;width:72px;text-align:center;border:2px solid #006C4B;border-radius:8px;padding:8px 0\">\n<div class=\"eyebrow\" style=\"color:#852428\">Nov<\u002Fdiv>\n<div class=\"disp\" style=\"font-size:32px;color:#006C4B\">12<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 class=\"h3\" style=\"font-size:22px;margin-bottom:6px;color:#006C4B\">Pizza Factory fundraiser<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">All day, Thursday. Mention the fundraiser and 20% of proceeds support the chipper program and community outreach. It repeats every second Thursday.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:20px;background:#fff;border-radius:10px;padding:24px;align-items:flex-start\">\n<div style=\"flex:none;width:72px;text-align:center;border:2px solid #006C4B;border-radius:8px;padding:8px 0\">\n<div class=\"eyebrow\" style=\"color:#852428\">Any<\u002Fdiv>\n<div class=\"disp\" style=\"font-size:32px;color:#006C4B\">day<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 class=\"h3\" style=\"font-size:22px;margin-bottom:6px;color:#006C4B\">Hambro recycling donations<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Take your recycling to Hambro and ask to donate it to the Willow Creek Fire Safe Council.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin:4px 0 0;font-size:16px\">We also keep the first mile of Highway 96 clean through Adopt-a-Highway. Dates are posted here and on <a href=\"https://www.facebook.com/wcfiresafe/\">Facebook<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROJECTS -->\n<section style=\"background:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#852428\">Projects on the ground<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:48px;color:#006C4B;max-width:760px\">Roadsides cleared, evacuation routes opened<\u002Fh2>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;margin-bottom:72px\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#41454A\">2025 PG&amp;E Western Willow Creek Risk Reduction Project<\u002Fp>\n<h3 class=\"disp\" style=\"font-size:30px;margin-bottom:16px;color:#006C4B\">Brannan Mountain Roadside Fuels Reduction<\u002Fh3>\n<p style=\"margin:0 0 16px\">We treated roadside fuels on private property along Brannan Mountain Road, within 500 feet of PG&amp;E infrastructure and driveways next to powerlines.<\u002Fp>\n<p style=\"margin:0 0 16px\">The shaded fuel breaks protect electrical assets and lower the risk of an ignition spreading into the homes PG&amp;E serves. Residents and emergency crews now have better ingress and egress on a vital secondary evacuation route for Eastern Humboldt.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: Brannan Mountain Rd, before]<\u002Fdiv>\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: Brannan Mountain Rd, after]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"assessment\" style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\">\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;gap:16px;order:2\">\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: defensible space, before]<\u002Fdiv>\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: defensible space, after]<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;order:1\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#41454A\">Multi-year regional partnership<\u002Fp>\n<h3 class=\"disp\" style=\"font-size:30px;margin-bottom:16px;color:#006C4B\">Greater Willow Creek Wildfire Resilience<\u002Fh3>\n<p style=\"margin:0 0 16px\">Crews remove hazardous fuels on private property, focusing on roadsides and the 100 feet around homes. That creates defensible space and safer ways in and out.<\u002Fp>\n<p style=\"margin:0 0 16px\">The next phase is free home risk assessments. You learn how to harden your home, register water sources with the Blue Dot Program, and get an address sign that helps emergency services.<\u002Fp>\n<p style=\"margin:0 0 24px;font-size:17px\">Built with Humboldt County Resource Conservation District, Trinity County Resource Conservation District, and Willow Creek Volunteer Fire Department.<\u002Fp>\n<div style=\"background:#EDF2EE;border-radius:10px;padding:22px\">\n<p style=\"margin:0 0 4px;font-weight:700\">Project coordinator Jen Hildreth<\u002Fp>\n<p style=\"margin:0 0 14px;font-size:17px\">jen@wcfiresafe.org · 530-990-8139<\u002Fp>\n<a class=\"btn btn-y\" href=\"mailto:jen@wcfiresafe.org?subject=Greater%20WC%20Wildfire%20Defense%20Project\" style=\"background:{{accent}}\">Email to sign up<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FIRST RESPONDERS -->\n<section id=\"first-responders\" style=\"padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:center\">\n<div style=\"flex:none;width:200px;height:200px;border-radius:50%;background:#1D5FD1;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\">\n<div style=\"width:64px;height:64px;border-radius:50%;background:#fff\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:16px;color:#006C4B\">Help first responders find you fast<\u002Fh2>\n<p style=\"margin:0 0 24px;max-width:640px\">The Blue Dot Program marks the water sources on your property so firefighters can spot them. A reflective address sign shows crews your driveway in smoke and darkness. Both are part of the free home assessment.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a class=\"btn btn-g\" href=\"https://forms.gle/SitbVK8eFhowtrQD7\">Complete the sign-up form<\u002Fa>\n<a class=\"btn btn-line\" href=\"https://img1.wsimg.com/blobby/go/89a60f8b-d11b-4ca4-a629-3127aed3af68/GWCWRP_ProgramInterestFlyer_QRCode.pdf\" style=\"color:#006C4B\">Program flyer (PDF)<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRINITY + LEARN -->\n<section style=\"padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px\">\n<div style=\"flex:1 1 420px;min-width:0;background:#fff;border:2px solid #006C4B;border-radius:10px;padding:32px\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#852428\">Trinity County residents<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:28px;margin-bottom:12px;color:#006C4B\">Need help managing flammable vegetation?<\u002Fh2>\n<p style=\"margin:0 0 20px\">Property owners in Trinity County can sign up for free home assessments.<\u002Fp>\n<a class=\"btn btn-g\" href=\"https://docs.google.com/forms/d/e/1FAIpQLSdfb5ui_gXYZb3lxuLAR1ym8pM5deU2MTj7AjCxRb50sqAyiw/viewform\">Complete the form<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;background:#fff;border-radius:10px;padding:32px\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#852428\">Video<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:28px;margin-bottom:12px;color:#006C4B\">Fire safe solutions for design, building, and upkeep<\u002Fh2>\n<p style=\"margin:0 0 20px\">See which home improvements raise your wildfire resilience.<\u002Fp>\n<a class=\"btn btn-g\" href=\"https://www.youtube.com/watch?v=9TQDP3v2eiI\">Watch on YouTube<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SUPPORT -->\n<section style=\"background:#41454A;color:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:12px;max-width:720px;color:#fff\">Volunteers run this council. You keep it running.<\u002Fh2>\n<p style=\"margin:0 0 40px;max-width:640px;color:#E9EDEA\">We are a 501(c)(3) nonprofit. Memberships and donations fund the chipper, free assessments, address signs, and fuel reduction projects.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Become a member<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Members get access to the chipper on their property and support free assessments, address signs, and fuel reduction near homes.<\u002Fp>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/ticketing/willow-creek-fire-safe-council-membership-drive\" style=\"background:{{accent}};margin-top:auto;align-self:flex-start\">Join<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Make a donation<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Your gift sustains a volunteer organization and keeps Willow Creek and nearby communities fire safe.<\u002Fp>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/donation-form/willow-creek-fire-safe-council-donation\" style=\"background:{{accent}};margin-top:auto;align-self:flex-start\">Donate<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Give without writing a check<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Eat at Willow Creek Pizza Factory on the second Thursday of the month, or donate your recycling at Hambro.<\u002Fp>\n<a href=\"#events\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">See the dates →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- FOOTER -->\n<footer style=\"background:#112541;color:#E4E9F0;padding-top:64px;padding-bottom:40px\">\n<div class=\"wrap\">\n<div style=\"display:flex;flex-wrap:wrap;gap:40px 56px\">\n<div style=\"flex:1 1 280px;min-width:0\">\n<div style=\"display:inline-block;background:#fff;border-radius:8px;padding:12px;line-height:0;margin-bottom:16px\">\n<img src=\"d9f1c596-2220-4386-8e95-53dd4de86a6b\" alt=\"Willow Creek Fire Safe Council logo\" style=\"width:84px;height:auto;display:block\">\n<\u002Fdiv>\n<p style=\"margin:0 0 16px;font-size:16px\">Reducing wildfire risk and increasing survivability by implementing fuels reduction projects and helping residents of the Willow Creek area make their homes, neighborhoods and communities fire safe.<\u002Fp>\n<p style=\"margin:0;font-size:16px\">Nonprofit 501(c)(3)<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0;font-size:16px\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#C1D0C6\">Contact<\u002Fp>\n<p style=\"margin:0 0 6px\">admin@wcfiresafe.org<\u002Fp>\n<p style=\"margin:0 0 6px\">530-629-6008<\u002Fp>\n<p style=\"margin:0 0 6px\">40620 State Highway 299<br>Willow Creek, CA 95573<\u002Fp>\n<p style=\"margin:0\">P.O. Box 224, Willow Creek, CA 95573<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;font-size:16px;display:flex;flex-direction:column;gap:6px\">\n<p class=\"eyebrow\" style=\"margin:0 0 6px;color:#C1D0C6\">The council<\u002Fp>\n<a href=\"https://wcfiresafe.org/about\">About<\u002Fa>\n<a href=\"https://wcfiresafe.org/membership\">Membership<\u002Fa>\n<a href=\"https://wcfiresafe.org/cwpp\">Community Wildfire Protection Plan<\u002Fa>\n<a href=\"https://wcfiresafe.org/bylaws\">Bylaws<\u002Fa>\n<a href=\"https://wcfiresafe.org/hiring\">Hiring<\u002Fa>\n<a href=\"https://wcfiresafe.org/privacy-policy\">Privacy policy<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;font-size:16px;display:flex;flex-direction:column;gap:6px\">\n<p class=\"eyebrow\" style=\"margin:0 0 6px;color:#C1D0C6\">Neighbors and resources<\u002Fp>\n<a href=\"https://humboldtgov.org/689/Fire-Safe-Council\">Humboldt County Fire Safe Council<\u002Fa>\n<a href=\"https://firesafetrinity.org/\">Trinity County Fire Safe Council<\u002Fa>\n<a href=\"https://www.elementalfilm.com/\">Elemental, a documentary on reimagining wildfire<\u002Fa>\n<a href=\"https://www.facebook.com/wcfiresafe/\">Facebook<\u002Fa>\n<a href=\"https://www.instagram.com/willowcreekfiresafecouncil/\">Instagram<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:48px 0 0;font-size:15px;color:#C1D0C6\">© 2026 Willow Creek Fire Safe Council. All rights reserved.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle><div>\n\n\n<a href=\"#main\" style=\"position:absolute;left:-9999px;top:0;background:#fff;color:#41454A;padding:12px 16px;z-index:10\">Skip to content<\u002Fa>\n\n\n<header style=\"background:#fff;border-bottom:1px solid #C1D0C6\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-top:14px;padding-bottom:14px\">\n<a href=\"https://wcfiresafe.org/\" aria-label=\"Willow Creek Fire Safe Council home\" style=\"display:block;line-height:0\">\n<img src=\"d9f1c596-2220-4386-8e95-53dd4de86a6b\" alt=\"Willow Creek Fire Safe Council logo\" style=\"width:96px;height:auto;display:block\">\n<\u002Fa>\n<nav class=\"nav\" aria-label=\"Main\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px\">\n<a href=\"https://wcfiresafe.org/chipper-program\">Chipper Program<\u002Fa>\n<a href=\"https://wcfiresafe.org/firewise-communities\">Firewise<\u002Fa>\n<a href=\"https://wcfiresafe.org/cwpp\">CWPP<\u002Fa>\n<a href=\"https://wcfiresafe.org/about\">About<\u002Fa>\n<a href=\"#events\">Events<\u002Fa>\n<a href=\"https://wcfiresafe.org/contact-us\">Contact<\u002Fa>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/donation-form/willow-creek-fire-safe-council-donation\" style=\"background:#FFB547;margin-left:6px;padding:0 22px;color:#1F2326\">Donate<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\">\n\n\n<section style=\"background:#006C4B;color:#fff;overflow:hidden\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:40px 56px;padding-top:64px;padding-bottom:48px;align-items:center\">\n<div style=\"flex:1 1 520px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 18px;color:#fff\">Willow Creek, California · Serving since 2002<\u002Fp>\n<h1 class=\"disp\" style=\"font-size:clamp(34px,5vw,52px);color:#fff\">A fire safe Willow Creek starts at your driveway.<\u002Fh1>\n<p style=\"font-size:21px;max-width:560px;margin:24px 0 0;color:#E9F0EB\">We clear roadside fuels, assess homes for free, and help neighbors get ready, so the whole community is harder to burn and easier to leave.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:32px\">\n<a class=\"btn btn-y\" href=\"#assessment\" style=\"background:#FFB547\">Get a free home assessment<\u002Fa>\n<a class=\"btn btn-line\" href=\"https://www.zeffy.com/en-US/ticketing/willow-creek-fire-safe-council-membership-drive\" style=\"color:#fff\">Join the council<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 340px;min-width:0;max-width:460px\">\n<div style=\"background:#fff;color:#41454A;border-radius:10px;padding:28px\">\n<p class=\"eyebrow\" style=\"margin:0 0 8px;color:#852428\">Before fire season, and during it<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:30px;margin-bottom:12px;color:#006C4B\">Know your evacuation zone<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:17px\">Look up your zone now. Then pick a meeting place and a second way out.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<a class=\"btn btn-g\" href=\"https://protect.genasys.com/search\" style=\"justify-content:space-between\">Humboldt County zones <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<a class=\"btn btn-g\" href=\"https://trinityfriends.maps.arcgis.com/apps/webappviewer/index.html?id=f4ba89983bba4e2aa3f0d608b30b4fb8\" style=\"justify-content:space-between\">Trinity County zones <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<svg viewBox=\"0 0 1440 280\" preserveAspectRatio=\"xMidYMax slice\" width=\"100%\" height=\"260\" style=\"display:block;width:100%;height:clamp(150px,22vw,280px)\" aria-hidden=\"true\" focusable=\"false\">\n<defs>\n<path id=\"pine-dc-static\" d=\"M0 -100 L18 -62 L9 -62 L26 -30 L12 -30 L32 0 L-32 0 L-12 -30 L-26 -30 L-9 -62 L-18 -62 Z\"><\u002Fpath>\n<\u002Fdefs>\n<circle cx=\"1090\" cy=\"120\" r=\"52\" fill=\"#FFB547\"><\u002Fcircle>\n<polygon fill=\"#C1D0C6\" opacity=\"0.4\" points=\"0,190 110,110 190,160 330,50 470,150 560,95 690,180 830,40 970,150 1090,85 1210,165 1330,95 1440,150 1440,280 0,280\"><\u002Fpolygon>\n<polygon fill=\"#00573C\" points=\"0,235 140,150 260,205 400,120 540,210 690,140 820,215 980,130 1120,205 1260,150 1440,215 1440,280 0,280\"><\u002Fpolygon>\n<g fill=\"#004D35\">\n<use href=\"#pine-dc-static\" transform=\"translate(60 262) scale(0.8)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(170 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(300 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(420 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(540 262) scale(0.85)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(660 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(790 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(900 262) scale(0.75)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1030 262) scale(0.85)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1150 262) scale(0.7)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1280 262) scale(0.9)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1390 262) scale(0.75)\"><\u002Fuse>\n<\u002Fg>\n<g fill=\"#003A28\">\n<use href=\"#pine-dc-static\" transform=\"translate(30 282) scale(1.9)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(125 282) scale(1.3)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(215 282) scale(1.6)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(335 282) scale(1.1)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(470 282) scale(1.5)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(565 282) scale(1.0)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(700 282) scale(1.7)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(805 282) scale(1.2)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(930 282) scale(1.9)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1040 282) scale(1.2)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1150 282) scale(1.6)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1260 282) scale(1.3)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1360 282) scale(1.8)\"><\u002Fuse>\n<use href=\"#pine-dc-static\" transform=\"translate(1428 282) scale(1.2)\"><\u002Fuse>\n<\u002Fg>\n<rect x=\"0\" y=\"268\" width=\"1440\" height=\"12\" fill=\"#003A28\"><\u002Frect>\n<\u002Fsvg>\n<\u002Fsection>\n\n\n<section id=\"mission\" style=\"background:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:48px 64px;align-items:flex-start\">\n<div style=\"flex:1 1 380px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 14px;color:#852428\">Our mission<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);color:#006C4B;margin-bottom:24px\">To reduce wildfire risk and increase survivability.<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:20px\">We do that by implementing fuels reduction projects and encouraging residents of the Willow Creek area to make their homes, neighborhoods and communities fire safe.<\u002Fp>\n<p style=\"margin:0;font-size:16px\">Willow Creek Fire Safe Council is a California nonprofit public benefit corporation and a 501(c)(3) public charity.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 440px;min-width:0\">\n<h3 class=\"eyebrow\" style=\"margin:0 0 16px;color:#41454A\">What we work toward<\u002Fh3>\n<ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">A<\u002Fspan><span style=\"min-width:0\">Increase community awareness and understanding of both the benefits and threats of wildland fire<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">B<\u002Fspan><span style=\"min-width:0\">Educate residents on ways to protect their lives and property from loss to catastrophic wildland fire<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">C<\u002Fspan><span style=\"min-width:0\">Generate individual and community action to reduce wildfire hazards and plan for emergency response<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">D<\u002Fspan><span style=\"min-width:0\">Reduce wildfire hazards by removing flammable vegetation around homes and evacuation routes<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">E<\u002Fspan><span style=\"min-width:0\">Enhance communication between the public and federal, state, county and local agencies to identify and prioritize hazard reduction projects and co-ordinate community planning<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">F<\u002Fspan><span style=\"min-width:0\">Develop and monitor a Community Wildfire Protection Plan for the Willow Creek area to address hazard mitigation, community preparedness, structure protection and wildfire response<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:18px;padding:14px 0;border-top:1px solid #C1D0C6;border-bottom:1px solid #C1D0C6\"><span class=\"h3\" style=\"flex:none;width:24px;color:#852428;font-size:20px\">G<\u002Fspan><span style=\"min-width:0\">Engage the youth of our communities in fire prevention by providing activities and educational opportunities related to fire safety and protecting natural resources<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding-top:72px;padding-bottom:24px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:32px;color:#006C4B\">Four ways to get ready this month<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Free home risk assessment<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Learn how to harden your home and what to clear within 100 feet.<\u002Fp>\n<a href=\"#assessment\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Sign up →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8\"><\u002Fpath><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Chipper Program<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Members can have brush chipped from around their homes.<\u002Fp>\n<a href=\"https://wcfiresafe.org/chipper-program\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">How it works →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"#1D5FD1\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.5\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Blue Dot and address signs<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Mark your water source and your address so crews find you fast.<\u002Fp>\n<a href=\"#first-responders\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Get on the list →<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 240px;min-width:0;background:#fff;border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#006C4B\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n<h3 class=\"h3\" style=\"font-size:22px;color:#006C4B\">Firewise Community<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Willow Creek holds Firewise certification. See what it means for you.<\u002Fp>\n<a href=\"https://wcfiresafe.org/firewise-communities\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">Learn more →<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"events\" style=\"padding-top:64px;padding-bottom:64px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:32px;color:#006C4B\">Meetings and events<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n\n<div style=\"flex:1 1 420px;min-width:0;background:#006C4B;color:#fff;border-radius:10px;padding:36px\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#fff\">Monthly board meeting · open to everyone<\u002Fp>\n<p class=\"disp\" style=\"font-size:40px;margin-bottom:6px\">Thu, Nov 5 · 6 pm<\u002Fp>\n<p style=\"margin:0 0 20px;color:#E9F0EB\">First Thursday of every month<\u002Fp>\n<p style=\"margin:0 0 4px;font-weight:700\">In person<\u002Fp>\n<p style=\"margin:0 0 20px;color:#E9F0EB\">40620 Hwy. 299, Willow Creek, CA 95573<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a class=\"btn btn-y\" href=\"https://us06web.zoom.us/j/86943975943?pwd=qamI5EEDfB6Nbn5HSbuJouliqQt7Yg.1#success\" style=\"background:#FFB547\">Join by Zoom<\u002Fa>\n<a class=\"btn btn-line\" href=\"http://eepurl.com/iSznJk\" style=\"color:#fff\">Get an invite each month<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin:20px 0 0;color:#E9F0EB;font-size:16px\">Zoom meeting ID 869 4397 5943 · Passcode 712931<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n\n<div style=\"display:flex;gap:20px;background:#fff;border-radius:10px;padding:24px;align-items:flex-start\">\n<div style=\"flex:none;width:72px;text-align:center;border:2px solid #006C4B;border-radius:8px;padding:8px 0\">\n<div class=\"eyebrow\" style=\"color:#852428\">Nov<\u002Fdiv>\n<div class=\"disp\" style=\"font-size:32px;color:#006C4B\">12<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 class=\"h3\" style=\"font-size:22px;margin-bottom:6px;color:#006C4B\">Pizza Factory fundraiser<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">All day, Thursday. Mention the fundraiser and 20% of proceeds support the chipper program and community outreach. It repeats every second Thursday.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:20px;background:#fff;border-radius:10px;padding:24px;align-items:flex-start\">\n<div style=\"flex:none;width:72px;text-align:center;border:2px solid #006C4B;border-radius:8px;padding:8px 0\">\n<div class=\"eyebrow\" style=\"color:#852428\">Any<\u002Fdiv>\n<div class=\"disp\" style=\"font-size:32px;color:#006C4B\">day<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"min-width:0\">\n<h3 class=\"h3\" style=\"font-size:22px;margin-bottom:6px;color:#006C4B\">Hambro recycling donations<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Take your recycling to Hambro and ask to donate it to the Willow Creek Fire Safe Council.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin:4px 0 0;font-size:16px\">We also keep the first mile of Highway 96 clean through Adopt-a-Highway. Dates are posted here and on <a href=\"https://www.facebook.com/wcfiresafe/\">Facebook<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#852428\">Projects on the ground<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:48px;color:#006C4B;max-width:760px\">Roadsides cleared, evacuation routes opened<\u002Fh2>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;margin-bottom:72px\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#41454A\">2025 PG&amp;E Western Willow Creek Risk Reduction Project<\u002Fp>\n<h3 class=\"disp\" style=\"font-size:30px;margin-bottom:16px;color:#006C4B\">Brannan Mountain Roadside Fuels Reduction<\u002Fh3>\n<p style=\"margin:0 0 16px\">We treated roadside fuels on private property along Brannan Mountain Road, within 500 feet of PG&amp;E infrastructure and driveways next to powerlines.<\u002Fp>\n<p style=\"margin:0 0 16px\">The shaded fuel breaks protect electrical assets and lower the risk of an ignition spreading into the homes PG&amp;E serves. Residents and emergency crews now have better ingress and egress on a vital secondary evacuation route for Eastern Humboldt.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;gap:16px\">\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: Brannan Mountain Rd, before]<\u002Fdiv>\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: Brannan Mountain Rd, after]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"assessment\" style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\">\n<div style=\"flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;gap:16px;order:2\">\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: defensible space, before]<\u002Fdiv>\n<div class=\"ph\" style=\"flex:1 1 200px;min-height:260px;border-radius:8px\">[Photo: defensible space, after]<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;order:1\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#41454A\">Multi-year regional partnership<\u002Fp>\n<h3 class=\"disp\" style=\"font-size:30px;margin-bottom:16px;color:#006C4B\">Greater Willow Creek Wildfire Resilience<\u002Fh3>\n<p style=\"margin:0 0 16px\">Crews remove hazardous fuels on private property, focusing on roadsides and the 100 feet around homes. That creates defensible space and safer ways in and out.<\u002Fp>\n<p style=\"margin:0 0 16px\">The next phase is free home risk assessments. You learn how to harden your home, register water sources with the Blue Dot Program, and get an address sign that helps emergency services.<\u002Fp>\n<p style=\"margin:0 0 24px;font-size:17px\">Built with Humboldt County Resource Conservation District, Trinity County Resource Conservation District, and Willow Creek Volunteer Fire Department.<\u002Fp>\n<div style=\"background:#EDF2EE;border-radius:10px;padding:22px\">\n<p style=\"margin:0 0 4px;font-weight:700\">Project coordinator Jen Hildreth<\u002Fp>\n<p style=\"margin:0 0 14px;font-size:17px\">jen@wcfiresafe.org · 530-990-8139<\u002Fp>\n<a class=\"btn btn-y\" href=\"mailto:jen@wcfiresafe.org?subject=Greater%20WC%20Wildfire%20Defense%20Project\" style=\"background:#FFB547\">Email to sign up<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"first-responders\" style=\"padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:center\">\n<div style=\"flex:none;width:200px;height:200px;border-radius:50%;background:#1D5FD1;display:flex;align-items:center;justify-content:center\" aria-hidden=\"true\">\n<div style=\"width:64px;height:64px;border-radius:50%;background:#fff\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:16px;color:#006C4B\">Help first responders find you fast<\u002Fh2>\n<p style=\"margin:0 0 24px;max-width:640px\">The Blue Dot Program marks the water sources on your property so firefighters can spot them. A reflective address sign shows crews your driveway in smoke and darkness. Both are part of the free home assessment.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a class=\"btn btn-g\" href=\"https://forms.gle/SitbVK8eFhowtrQD7\">Complete the sign-up form<\u002Fa>\n<a class=\"btn btn-line\" href=\"https://img1.wsimg.com/blobby/go/89a60f8b-d11b-4ca4-a629-3127aed3af68/GWCWRP_ProgramInterestFlyer_QRCode.pdf\" style=\"color:#006C4B\">Program flyer (PDF)<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding-bottom:80px\">\n<div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px\">\n<div style=\"flex:1 1 420px;min-width:0;background:#fff;border:2px solid #006C4B;border-radius:10px;padding:32px\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#852428\">Trinity County residents<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:28px;margin-bottom:12px;color:#006C4B\">Need help managing flammable vegetation?<\u002Fh2>\n<p style=\"margin:0 0 20px\">Property owners in Trinity County can sign up for free home assessments.<\u002Fp>\n<a class=\"btn btn-g\" href=\"https://docs.google.com/forms/d/e/1FAIpQLSdfb5ui_gXYZb3lxuLAR1ym8pM5deU2MTj7AjCxRb50sqAyiw/viewform\">Complete the form<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;background:#fff;border-radius:10px;padding:32px\">\n<p class=\"eyebrow\" style=\"margin:0 0 10px;color:#852428\">Video<\u002Fp>\n<h2 class=\"disp\" style=\"font-size:28px;margin-bottom:12px;color:#006C4B\">Fire safe solutions for design, building, and upkeep<\u002Fh2>\n<p style=\"margin:0 0 20px\">See which home improvements raise your wildfire resilience.<\u002Fp>\n<a class=\"btn btn-g\" href=\"https://www.youtube.com/watch?v=9TQDP3v2eiI\">Watch on YouTube<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background:#41454A;color:#fff;padding-top:80px;padding-bottom:80px\">\n<div class=\"wrap\">\n<h2 class=\"disp\" style=\"font-size:clamp(28px,3.4vw,40px);margin-bottom:12px;max-width:720px;color:#fff\">Volunteers run this council. You keep it running.<\u002Fh2>\n<p style=\"margin:0 0 40px;max-width:640px;color:#E9EDEA\">We are a 501(c)(3) nonprofit. Memberships and donations fund the chipper, free assessments, address signs, and fuel reduction projects.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Become a member<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Members get access to the chipper on their property and support free assessments, address signs, and fuel reduction near homes.<\u002Fp>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/ticketing/willow-creek-fire-safe-council-membership-drive\" style=\"background:#FFB547;margin-top:auto;align-self:flex-start\">Join<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Make a donation<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Your gift sustains a volunteer organization and keeps Willow Creek and nearby communities fire safe.<\u002Fp>\n<a class=\"btn btn-y\" href=\"https://www.zeffy.com/en-US/donation-form/willow-creek-fire-safe-council-donation\" style=\"background:#FFB547;margin-top:auto;align-self:flex-start\">Donate<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 300px;min-width:0;background:#fff;color:#41454A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n<h3 class=\"disp\" style=\"font-size:26px;color:#006C4B\">Give without writing a check<\u002Fh3>\n<p style=\"margin:0;font-size:17px\">Eat at Willow Creek Pizza Factory on the second Thursday of the month, or donate your recycling at Hambro.<\u002Fp>\n<a href=\"#events\" style=\"font-weight:700;margin-top:auto;color:#006C4B\">See the dates →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n\n<footer style=\"background:#112541;color:#E4E9F0;padding-top:64px;padding-bottom:40px\">\n<div class=\"wrap\">\n<div style=\"display:flex;flex-wrap:wrap;gap:40px 56px\">\n<div style=\"flex:1 1 280px;min-width:0\">\n<div style=\"display:inline-block;background:#fff;border-radius:8px;padding:12px;line-height:0;margin-bottom:16px\">\n<img src=\"d9f1c596-2220-4386-8e95-53dd4de86a6b\" alt=\"Willow Creek Fire Safe Council logo\" style=\"width:84px;height:auto;display:block\">\n<\u002Fdiv>\n<p style=\"margin:0 0 16px;font-size:16px\">Reducing wildfire risk and increasing survivability by implementing fuels reduction projects and helping residents of the Willow Creek area make their homes, neighborhoods and communities fire safe.<\u002Fp>\n<p style=\"margin:0;font-size:16px\">Nonprofit 501(c)(3)<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 220px;min-width:0;font-size:16px\">\n<p class=\"eyebrow\" style=\"margin:0 0 12px;color:#C1D0C6\">Contact<\u002Fp>\n<p style=\"margin:0 0 6px\">admin@wcfiresafe.org<\u002Fp>\n<p style=\"margin:0 0 6px\">530-629-6008<\u002Fp>\n<p style=\"margin:0 0 6px\">40620 State Highway 299<br>Willow Creek, CA 95573<\u002Fp>\n<p style=\"margin:0\">P.O. Box 224, Willow Creek, CA 95573<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;font-size:16px;display:flex;flex-direction:column;gap:6px\">\n<p class=\"eyebrow\" style=\"margin:0 0 6px;color:#C1D0C6\">The council<\u002Fp>\n<a href=\"https://wcfiresafe.org/about\">About<\u002Fa>\n<a href=\"https://wcfiresafe.org/membership\">Membership<\u002Fa>\n<a href=\"https://wcfiresafe.org/cwpp\">Community Wildfire Protection Plan<\u002Fa>\n<a href=\"https://wcfiresafe.org/bylaws\">Bylaws<\u002Fa>\n<a href=\"https://wcfiresafe.org/hiring\">Hiring<\u002Fa>\n<a href=\"https://wcfiresafe.org/privacy-policy\">Privacy policy<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;min-width:0;font-size:16px;display:flex;flex-direction:column;gap:6px\">\n<p class=\"eyebrow\" style=\"margin:0 0 6px;color:#C1D0C6\">Neighbors and resources<\u002Fp>\n<a href=\"https://humboldtgov.org/689/Fire-Safe-Council\">Humboldt County Fire Safe Council<\u002Fa>\n<a href=\"https://firesafetrinity.org/\">Trinity County Fire Safe Council<\u002Fa>\n<a href=\"https://www.elementalfilm.com/\">Elemental, a documentary on reimagining wildfire<\u002Fa>\n<a href=\"https://www.facebook.com/wcfiresafe/\">Facebook<\u002Fa>\n<a href=\"https://www.instagram.com/willowcreekfiresafecouncil/\">Instagram<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:48px 0 0;font-size:15px;color:#C1D0C6\">© 2026 Willow Creek Fire Safe Council. All rights reserved.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv><\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFB547&quot;,&quot;options&quot;:[&quot;#FFB547&quot;,&quot;#006C4B&quot;,&quot;#112541&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#FFB547' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
