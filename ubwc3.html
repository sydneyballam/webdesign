<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Boutique Willow Creek — Virtual Magazine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#F5F0E6',
                        magDark: '#1A1C1B',
                        magGold: '#B89753',
                        magMuted: '#6B706C'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #2E231A; /* Rich desk wood tone */
            color: #1A1C1B;
            overflow-x: hidden;
            perspective: 2500px;
        }
        h1, h2, h3, .mag-serif {
            font-family: 'Playfair Display', serif;
        }

        /* ONE SINGLE UNIFIED BOOK SHEET */
        .magazine-book {
            background-color: #F5F0E6;
            box-shadow: 0 35px 70px -15px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
        }

        /* CENTERFOLD SPINE CREASE */
        .book-spine {
            background: linear-gradient(
                to right,
                rgba(0,0,0,0.02) 0%,
                rgba(0,0,0,0.14) 47%,
                rgba(255,255,255,0.85) 50%,
                rgba(0,0,0,0.10) 53%,
                rgba(0,0,0,0.02) 100%
            );
            pointer-events: none;
        }

        /* REALISTIC 3D PAGE TURN FLIP */
        .page-leaf {
            transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.4s ease;
            transform-style: preserve-3d;
        }
        .flipping-right {
            transform-origin: left center;
            transform: rotateY(-180deg);
            opacity: 0.2;
        }
        .flipping-left {
            transform-origin: right center;
            transform: rotateY(180deg);
            opacity: 0.2;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-magGold selection:text-white py-6 px-4 sm:px-8">

    <!-- TOP HEADER -->
    <header class="max-w-6xl mx-auto w-full mb-4 flex justify-between items-center text-stone-300 border-b border-stone-600/40 pb-3">
        <div>
            <span class="text-[9px] uppercase tracking-[0.3em] text-magGold font-bold block">Willow Creek, California</span>
            <span class="mag-serif text-lg font-bold tracking-wide text-white">Unique Boutique Gazette</span>
        </div>
        
        <div class="flex items-center gap-6">
            <span id="pageIndicator" class="text-xs font-medium uppercase tracking-widest text-stone-300">Spread 01 of 04</span>
            <a href="tel:7075995811" class="bg-magGold text-stone-950 px-4 py-1.5 rounded-sm text-xs uppercase font-bold tracking-wider hover:bg-amber-500 transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-phone"></i> (707) 599-5811
            </a>
        </div>
    </header>

    <!-- MAIN SINGLE-SHEET OPEN SPREAD -->
    <main class="max-w-6xl mx-auto w-full flex-grow flex flex-col justify-center my-auto">
        
        <div class="magazine-book rounded-sm min-h-[660px] grid grid-cols-1 lg:grid-cols-2 relative overflow-hidden">
            
            <!-- CENTERFOLD CREASE -->
            <div class="hidden lg:block absolute inset-y-0 left-1/2 -translate-x-1/2 w-12 book-spine z-20"></div>

            <!-- LEFT PAGE -->
            <div onclick="prevSpread()" id="leftPane" class="page-leaf p-8 sm:p-14 border-b lg:border-b-0 border-stone-300/50 flex flex-col justify-between cursor-pointer hover:bg-black/3 transition relative z-10">
                <div class="absolute top-3 left-6 text-[10px] text-magMuted italic">&larr; Click to turn back</div>
                <div id="leftContent" class="mt-6 flex-grow flex flex-col justify-center">
                    <!-- Injected Left Item -->
                </div>
                <div class="mt-6 pt-3 border-t border-stone-300/80 flex justify-between text-[11px] text-magMuted font-mono">
                    <span>Unique Boutique Willow Creek</span>
                    <span id="leftPageNo">Page 01</span>
                </div>
            </div>

            <!-- RIGHT PAGE -->
            <div onclick="nextSpread()" id="rightPane" class="page-leaf p-8 sm:p-14 flex flex-col justify-between cursor-pointer hover:bg-black/3 transition relative z-10">
                <div class="absolute top-3 right-6 text-[10px] text-magMuted italic">Click to turn forward &rarr;</div>
                <div id="rightContent" class="mt-6 flex-grow flex flex-col justify-center">
                    <!-- Injected Right Item -->
                </div>
                <div class="mt-6 pt-3 border-t border-stone-300/80 flex justify-between text-[11px] text-magMuted font-mono">
                    <span id="rightPageNo">Page 02</span>
                    <span>111 Mayfair St, CA</span>
                </div>
            </div>

        </div>

    </main>

    <!-- FOOTER HINT -->
    <footer class="max-w-6xl mx-auto w-full mt-4 text-center text-xs text-stone-400 italic mag-serif">
        <p>Click the right page to turn forward &bull; Click the left page to turn backward</p>
    </footer>

    <!-- ENGINE SCRIPT WITH 3D PAGE-TURN PHYSICS -->
    <script>
        const spreads = [
            // SPREAD 0: COVER & TABLE OF CONTENTS
            {
                leftPageNo: "Page 01",
                rightPageNo: "Page 02",
                left: `
                    <div class="text-center py-12 space-y-6">

                                <span class="text-magGold font-bold">Page 06</span>
                            </li>
                            <li class="flex justify-between border-b border-stone-300 pb-2">
                                <span class="font-semibold text-magDark">05. Men's Heavy Vintage Flannel Shirt</span>

            },
            // SPREAD 1: ITEMS 1 & 2 (Pages 3 & 4)
            {
                leftPageNo: "Page 03",
                rightPageNo: "Page 04",
                left: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-800 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Available</span>
                        </div>

                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Women's Clothing // Item 01</span>

                            <p class="text-xs text-magMuted font-light leading-relaxed">Delicate peach and ivory estate slip dress with original delicate stitching intact.</p>
                            <a href="tel:7075995811" onclick="event.stopPropagation()" class="inline-block bg-magDark text-white px-3.5 py-2 rounded-sm text-[11px] uppercase tracking-wider font-semibold mt-2 hover:bg-black">Inquire to Claim</a>
                        </div>
                    </div>
                `,
                right: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-800 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Available</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Bigfoot & Novelty // Item 02</span>
                            <h3 class="mag-serif text-2xl font-bold text-magDark">Bigfoot Tropical Hawaiian Novelty Shirt</h3>
                            <p class="text-sm font-bold text-magDark">$36.00</p>
                            <p class="text-xs text-magMuted font-light leading-relaxed">Iconic regional novelty button-down sourced directly from local Humboldt County estates.</p>
                            <a href="tel:7075995811" onclick="event.stopPropagation()" class="inline-block bg-magDark text-white px-3.5 py-2 rounded-sm text-[11px] uppercase tracking-wider font-semibold mt-2 hover:bg-black">Inquire to Claim</a>
                        </div>
                    </div>
                `
            },
            // SPREAD 2: ITEMS 3 & 4 (Pages 5 & 6)
            {
                leftPageNo: "Page 05",
                rightPageNo: "Page 06",
                left: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-800 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Available</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Vintage Kitchenware // Item 03</span>
                            <h3 class="mag-serif text-2xl font-bold text-magDark">7.5L German Stoneware Gärtopf Crock</h3>
                            <p class="text-sm font-bold text-magDark">$85.00</p>
                            <p class="text-xs text-magMuted font-light leading-relaxed">Original system Harsch Gärtopf brown glazed stoneware fermentation crock in pristine condition.</p>
                            <a href="tel:7075995811" onclick="event.stopPropagation()" class="inline-block bg-magDark text-white px-3.5 py-2 rounded-sm text-[11px] uppercase tracking-wider font-semibold mt-2 hover:bg-black">Inquire to Claim</a>
                        </div>
                    </div>
                `,
                right: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-800 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Available</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Vintage Kitchenware // Item 04</span>
                            <h3 class="mag-serif text-2xl font-bold text-magDark">Retro Green & Yellow Fiestaware Stack</h3>
                            <p class="text-sm font-bold text-magDark">$65.00</p>
                            <p class="text-xs text-magMuted font-light leading-relaxed">Authenticated mid-century ceramic plates and mugs featuring classic glazed primary colorways.</p>
                            <a href="tel:7075995811" onclick="event.stopPropagation()" class="inline-block bg-magDark text-white px-3.5 py-2 rounded-sm text-[11px] uppercase tracking-wider font-semibold mt-2 hover:bg-black">Inquire to Claim</a>
                        </div>
                    </div>
                `
            },
            // SPREAD 3: ITEMS 5 & 6 (Pages 7 & 8)
            {
                leftPageNo: "Page 07",
                rightPageNo: "Page 08",
                left: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-800 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Available</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Men's Clothing // Item 05</span>
                            <h3 class="mag-serif text-2xl font-bold text-magDark">Men's Heavy Vintage Flannel Utility Shirt</h3>
                            <p class="text-sm font-bold text-magDark">$32.00</p>
                            <p class="text-xs text-magMuted font-light leading-relaxed">Durable heavyweight cotton plaid flannel hand-selected from a regional estate collection.</p>
                            <a href="tel:7075995811" onclick="event.stopPropagation()" class="inline-block bg-magDark text-white px-3.5 py-2 rounded-sm text-[11px] uppercase tracking-wider font-semibold mt-2 hover:bg-black">Inquire to Claim</a>
                        </div>
                    </div>
                `,
                right: `
                    <div class="space-y-4">
                        <div class="relative h-64 bg-stone-200 rounded-sm overflow-hidden border border-stone-300">
                            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-stone-600 text-stone-200 text-[9px] uppercase tracking-widest px-2.5 py-1 rounded-sm shadow">Archived</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] uppercase font-bold tracking-widest text-magGold">Jewelry & Glam // Item 06</span>
                            <h3 class="mag-serif text-2xl font-bold text-magDark">Estate Rhinestone & Pearl Necklace</h3>
                            <p class="text-sm font-bold text-magDark">$45.00</p>
                            <p class="text-xs text-magMuted font-light leading-relaxed">Mid-century costume jewelry piece featuring handset crystals and secure clasp closure.</p>
                            <span class="inline-block text-stone-500 text-[11px] uppercase tracking-wider font-semibold mt-2">Item Sold / Claimed</span>
                        </div>
                    </div>
                `
            }
        ];

        let currentSpread = 0;

        function renderSpread(direction) {
            const data = spreads[currentSpread];
            const leftEl = document.getElementById('leftContent');
            const rightEl = document.getElementById('rightContent');
            const leftNo = document.getElementById('leftPageNo');
            const rightNo = document.getElementById('rightPageNo');
            const indicator = document.getElementById('pageIndicator');
            const rightPane = document.getElementById('rightPane');
            const leftPane = document.getElementById('leftPane');

            // Trigger 3D Page Flip Animation
            if(direction === 'forward') {
                rightPane.classList.add('flipping-right');
            } else {
                leftPane.classList.add('flipping-left');
            }

            setTimeout(() => {
                leftEl.innerHTML = data.left;
                rightEl.innerHTML = data.right;
                leftNo.innerText = data.leftPageNo;
                rightNo.innerText = data.rightPageNo;
                indicator.innerText = `Spread ${String(currentSpread + 1).padStart(2, '0')} of ${String(spreads.length).padStart(2, '0')}`;

                rightPane.classList.remove('flipping-right');
                leftPane.classList.remove('flipping-left');
            }, 350);
        }

        function nextSpread() {
            if (currentSpread < spreads.length - 1) {
                currentSpread++;
                renderSpread('forward');
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                renderSpread('backward');
            }
        }

        window.onload = () => {
            renderSpread('forward');
        };
    </script>
</body>
</html>
