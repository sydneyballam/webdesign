<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Boutique Willow Creek — Virtual Magazine & Catalog</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        magBg: '#F3EFE6',
                        magDark: '#1A1C1B',
                        magGold: '#B89753',
                        magMuted: '#6B706C',
                        magBorder: '#D8D0C1'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Editorial Serif & Clean Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #EAE5D9;
            color: #1A1C1B;
        }
        h1, h2, h3, .mag-serif {
            font-family: 'Playfair Display', serif;
        }
        .magazine-page {
            background-color: #F3EFE6;
            border: 1px solid #D8D0C1;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-magGold selection:text-white py-6 px-4 sm:px-8">

    <!-- MAGAZINE TOP CONTROLS & HEADER -->
    <header class="max-w-5xl mx-auto w-full mb-6 flex justify-between items-center border-b border-magBorder pb-4">
        <div>
            <span class="text-[9px] uppercase tracking-[0.3em] text-magGold font-semibold block">Willow Creek, California</span>
            <span class="mag-serif text-lg font-bold tracking-wide">Unique Boutique Gazette</span>
        </div>
        
        <!-- Page Indicator & Quick Actions -->
        <div class="flex items-center gap-6">
            <span id="pageIndicator" class="text-xs font-medium uppercase tracking-widest text-magMuted">Page 01 of 07</span>
            <a href="tel:7075995811" class="bg-magDark text-magBg px-4 py-1.5 rounded-sm text-xs uppercase font-semibold tracking-wider hover:bg-black transition flex items-center gap-2">
                <i class="fa-solid fa-phone text-magGold"></i> (707) 599-5811
            </a>
        </div>
    </header>

    <!-- MAIN MAGAZINE SPREAD CONTAINER -->
    <main class="max-w-5xl mx-auto w-full flex-grow flex flex-col justify-center">
        <div id="magazineSpread" class="magazine-page rounded-sm p-8 sm:p-14 min-h-[580px] flex flex-col justify-between relative transition-all duration-500">
            <!-- Dynamic Page Content Injected Here -->
        </div>

        <!-- FLIPPING CONTROLS FOOTER -->
        <div class="flex justify-between items-center mt-6 px-2">
            <button onclick="prevPage()" id="prevBtn" class="bg-magBorder hover:bg-stone-400 text-magDark px-5 py-2.5 rounded-sm text-xs uppercase font-semibold tracking-widest transition flex items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-left"></i> Previous Spread
            </button>
            <span class="text-xs italic text-magMuted mag-serif">Click items in TOC or use arrows to flip pages</span>
            <button onclick="nextPage()" id="nextBtn" class="bg-magDark hover:bg-black text-magBg px-5 py-2.5 rounded-sm text-xs uppercase font-semibold tracking-widest transition flex items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed">
                Next Spread <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <!-- MAGAZINE FOOTER -->
    <footer class="max-w-5xl mx-auto w-full mt-8 pt-4 border-t border-magBorder text-center text-[11px] text-magMuted font-light">
        <p>&copy; 2026 Unique Boutique Willow Creek &bull; 111 Mayfair St, Willow Creek, CA &bull; All Estate Records Reserved.</p>
    </footer>

    <!-- MAGAZINE SCRIPT & INVENTORY LOGIC -->
    <script>
        // Inventory data representing pages of the virtual magazine
        const magazinePages = [
            // PAGE 0: COVER & TABLE OF CONTENTS
            {
                type: "toc",
                title: "Table of Contents",
                subtitle: "Volume IV — Estate Acquisitions & Curiosities",
                items: [
                    { page: 1, title: "Vintage Shabby Chic Lace Slip Dress", category: "Women's Clothing", price: "$48.00" },
                    { page: 2, title: "Bigfoot Tropical Hawaiian Novelty Shirt", category: "Bigfoot & Novelty", price: "$36.00" },
                    { page: 3, title: "Authentic German Gärtopf 7.5L Stoneware Crock", category: "Vintage Kitchenware", price: "$85.00" },
                    { page: 4, title: "Vintage Green & Yellow Fiestaware Service Stack", category: "Vintage Kitchenware", price: "$65.00" },
                    { page: 5, title: "Men's Heavy Vintage Flannel Utility Shirt", category: "Men's Clothing", price: "$32.00" },
                    { page: 6, title: "Estate Rhinestone & Faux Pearl Statement Necklace", category: "Jewelry & Glam", price: "$45.00" }
                ]
            },
            // PAGE 1
            {
                type: "article",
                pageNo: 1,
                title: "Vintage Shabby Chic Lace Slip Dress",
                category: "Women's Clothing",
                price: "$48.00",
                image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=900",
                desc: "Delicate peach and ivory estate-acquired slip dress. Excellent vintage condition with original delicate stitching intact, sourced directly from a private Humboldt County collection.",
                status: "Available Now"
            },
            // PAGE 2
            {
                type: "article",
                pageNo: 2,
                title: "Bigfoot Tropical Hawaiian Novelty Shirt",
                category: "Bigfoot & Novelty",
                price: "$36.00",
                image: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&q=80&w=900",
                desc: "Iconic regional novelty button-down shirt featuring legendary cryptid motifs. A staple piece for local Willow Creek enthusiasts and collectors.",
                status: "Available Now"
            },
            // PAGE 3
            {
                type: "article",
                pageNo: 3,
                title: "Authentic German Gärtopf 7.5L Stoneware Crock",
                category: "Vintage Kitchenware",
                price: "$85.00",
                image: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?auto=format&fit=crop&q=80&w=900",
                desc: "Original system Harsch Gärtopf brown glazed stoneware fermentation crock in pristine estate condition. Complete with original ceramic weights.",
                status: "Available Now"
            },
            // PAGE 4
            {
                type: "article",
                pageNo: 4,
                title: "Vintage Green & Yellow Fiestaware Service Stack",
                category: "Vintage Kitchenware",
                price: "$65.00",
                image: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&q=80&w=900",
                desc: "Authenticated mid-century ceramic plates and mugs featuring classic glazed primary colorways. Sourced from a single-owner Willow Creek estate.",
                status: "Available Now"
            },
            // PAGE 5
            {
                type: "article",
                pageNo: 5,
                title: "Men's Heavy Vintage Flannel Utility Shirt",
                category: "Men's Clothing",
                price: "$32.00",
                image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&q=80&w=900",
                desc: "Durable heavyweight cotton plaid flannel hand-selected from a regional estate collection. Built for comfort and timeless northern California style.",
                status: "Available Now"
            },
            // PAGE 6
            {
                type: "article",
                pageNo: 6,
                title: "Estate Rhinestone & Faux Pearl Statement Necklace",
                category: "Jewelry & Glam",
                price: "$45.00",
                image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=900",
                desc: "Mid-century costume jewelry piece featuring handset crystals and secure clasp closure. A brilliant statement accessory with verified estate provenance.",
                status: "Archived / Sold"
            }
        ];

        let currentPage = 0;

        function renderMagazine() {
            const spread = document.getElementById('magazineSpread');
            const indicator = document.getElementById('pageIndicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            indicator.innerText = `Page ${String(currentPage + 1).padStart(2, '0')} of ${String(magazinePages.length).padStart(2, '0')}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === magazinePages.length - 1;

            const page = magazinePages[currentPage];

            if (page.type === 'toc') {
                // Render Table of Contents Cover
                let tocHtml = `
                    <div>
                        <div class="border-b-2 border-magDark pb-6 mb-8 flex justify-between items-end">
                            <div>
                                <span class="text-xs uppercase tracking-[0.3em] text-magGold font-bold block mb-1">Catalog Index</span>
                                <h1 class="mag-serif text-4xl sm:text-5xl font-bold text-magDark">${page.title}</h1>
                            </div>
                            <span class="text-xs italic text-magMuted hidden sm:inline">111 Mayfair St, Willow Creek, CA</span>
                        </div>
                        <p class="text-xs text-magMuted font-light mb-8 max-w-xl">
                            Welcome to our virtual edition catalog. Browse verified estate acquisitions below and click any entry to flip directly to its editorial spread.
                        </p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                `;

                page.items.forEach(item => {
                    tocHtml += `
                        <div onclick="goToPage(${item.page})" class="group cursor-pointer bg-white/60 hover:bg-white p-4 rounded-sm border border-magBorder transition flex justify-between items-center shadow-2xs">
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-widest text-magGold block">Page 0${item.page} // ${item.category}</span>
                                <h3 class="mag-serif text-sm font-bold text-magDark group-hover:text-magGold transition mt-0.5">${item.title}</h3>
                            </div>
                            <span class="text-xs font-semibold text-magDark">${item.price}</span>
                        </div>
                    `;
                });

                tocHtml += `
                        </div>
                    </div>
                    <div class="mt-10 pt-4 border-t border-magBorder flex justify-between items-center text-xs text-magMuted">
                        <span>Curated Direct from Local Estates</span>
                        <span class="font-semibold text-magDark">Use bottom arrows to turn pages &rarr;</span>
                    </div>
                `;
                spread.innerHTML = tocHtml;

            } else {
                // Render Article Spread
                const isAvailable = page.status === "Available Now";
                const badgeClass = isAvailable ? "bg-emerald-800 text-white" : "bg-stone-600 text-stone-200";

                spread.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                        <div class="lg:col-span-5 relative h-72 sm:h-96 bg-stone-200 rounded-sm overflow-hidden border border-magBorder shadow-sm">
                            <img src="${page.image}" alt="${page.title}" class="w-full h-full object-cover">
                            <span class="absolute top-4 left-4 text-[9px] uppercase tracking-widest font-semibold px-2.5 py-1 rounded-sm ${badgeClass}">
                                ${page.status}
                            </span>
                        </div>
                        <div class="lg:col-span-7 space-y-4 lg:pl-6">
                            <div class="flex justify-between items-center text-xs uppercase tracking-widest text-magGold font-semibold">
                                <span>Spread // Page 0${page.pageNo}</span>
                                <span>${page.category}</span>
                            </div>
                            <h2 class="mag-serif text-3xl sm:text-4xl font-bold text-magDark leading-tight">
                                ${page.title}
                            </h2>
                            <p class="text-sm font-semibold text-magDark">
                                Acquisition Price: <span class="text-lg text-magGold">${page.price}</span>
                            </p>
                            <p class="text-xs sm:text-sm text-magMuted font-light leading-relaxed">
                                ${page.desc}
                            </p>
                            <div class="pt-4 border-t border-magBorder flex flex-col sm:flex-row gap-3 items-center">
                                <a href="tel:7075995811" class="w-full bg-magDark hover:bg-black text-magBg text-center py-3 rounded-sm text-xs uppercase font-semibold tracking-widest transition shadow-sm flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-phone text-magGold"></i> Inquire or Claim (707) 599-5811
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 pt-3 border-t border-magBorder flex justify-between items-center text-xs text-magMuted">
                        <span>Unique Boutique Willow Creek Gazette</span>
                        <span class="font-semibold text-magDark">Spread 0${page.pageNo}</span>
                    </div>
                `;
            }
        }

        function nextPage() {
            if (currentPage < magazinePages.length - 1) {
                currentPage++;
                renderMagazine();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderMagazine();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToPage(pageNo) {
            currentPage = pageNo;
            renderMagazine();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = () => {
            renderMagazine();
        };
    </script>
</body>
</html>
