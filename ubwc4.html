<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Boutique - Radio Frequency Tuner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #2B1810; color: #F3E5AB; font-family: monospace; }
        .radio-dial { background: #1B0F0A; border: 4px solid #8C6239; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <header class="text-center max-w-2xl mx-auto">
        <span class="text-xs uppercase tracking-widest text-amber-500">WMYV Willow Creek &bull; 111 Mayfair St</span>
        <h1 class="text-3xl font-bold tracking-wider text-amber-200 mt-1">Boutique Radio Broadcast</h1>
    </header>

    <main class="max-w-2xl mx-auto w-full radio-dial rounded-2xl p-8 shadow-2xl text-center my-auto">
        <div class="mb-6">
            <span class="text-xs uppercase text-amber-400">Current Frequency Item</span>
            <h2 id="radioTitle" class="text-2xl font-bold text-white mt-1">Vintage Shabby Chic Lace Slip Dress</h2>
            <p id="radioPrice" class="text-xl text-amber-400 font-bold mt-1">$48.00</p>
        </div>

        <div class="my-6">
            <img id="radioImg" src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=400" class="w-full h-56 object-cover rounded border-2 border-amber-800 mx-auto">
        </div>

        <!-- TUNING SLIDER -->
        <div class="mb-6">
            <label class="block text-xs uppercase text-stone-400 mb-2">Tune Frequency Dial (88MHz - 108MHz)</label>
            <input type="range" min="1" max="3" value="1" oninput="tuneRadio(this.value)" class="w-full accent-amber-600 cursor-pointer">
        </div>

        <div class="flex justify-between items-center text-xs">
            <a href="https://sydneyballam.github.io/webdesign/" class="text-amber-300 hover:underline">Hub</a>
            <a href="tel:7075995811" class="bg-amber-700 hover:bg-amber-600 text-white px-4 py-2 rounded font-bold">Call Store (707) 599-5811</a>
        </div>
    </main>

    <footer class="text-center text-xs text-stone-500">
        &copy; 2026 Unique Boutique Willow Creek.
    </footer>

    <script>
        const database = [
            { title: "Vintage Shabby Chic Lace Slip Dress", price: "$48.00", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=400" },
            { title: "Bigfoot Tropical Hawaiian Novelty Shirt", price: "$36.00", img: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&q=80&w=400" },
            { title: "7.5L Stoneware Gärtopf Crock", price: "$85.00", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&q=80&w=400" }
        ];
        function tuneRadio(val) {
            const item = database[val - 1];
            document.getElementById('radioTitle').innerText = item.title;
            document.getElementById('radioPrice').innerText = item.price;
            document.getElementById('radioImg').src = item.img;
        }
    </script>
</body>
</html>
