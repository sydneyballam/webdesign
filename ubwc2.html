<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Boutique - Treasure Map & Compass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body { background: #EFE8D8; font-family: 'Special Elite', monospace; color: #2C221E; }
        .map-frame { border: 6px ridge #5C4033; background: #F7F3E9; position: relative; }
        .map-pin { animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <header class="text-center max-w-4xl mx-auto mb-6">
        <span class="text-xs uppercase tracking-widest text-amber-800 font-bold">[ Interactive Treasure Chart ]</span>
        <h1 class="text-4xl sm:text-5xl font-bold font-serif tracking-wide text-stone-900 mt-1" style="font-family: 'IM Fell English SC', serif;">Unique Boutique Expedition Map</h1>
        <p class="text-xs text-stone-600 mt-1">111 Mayfair St, Willow Creek, CA &bull; (707) 599-5811</p>
    </header>

    <main class="max-w-4xl mx-auto w-full map-frame rounded-xl p-6 shadow-2xl flex-grow flex flex-col justify-between">
        <!-- COMPASS HEADER -->
        <div class="flex justify-between items-center border-b-2 border-stone-400 pb-4 mb-6">
            <div class="flex items-center gap-2 text-amber-900 font-bold text-sm">
                <i class="fa-solid fa-compass text-2xl animate-spin" style="animation-duration: 10s;"></i>
                <span>Heading: Willow Creek Estate Sector</span>
            </div>
            <a href="https://sydneyballam.github.io/webdesign/" class="text-xs bg-stone-800 text-stone-200 px-3 py-1 rounded hover:bg-black">Return to Hub</a>
        </div>

        <!-- INTERACTIVE MAP VIEWER -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 my-auto" id="mapInventory">
            <!-- Injected via script -->
        </div>

        <!-- FOOTER MAP LEGEND -->
        <div class="mt-8 pt-4 border-t-2 border-stone-400 flex flex-col sm:flex-row justify-between items-center text-xs text-stone-700">
            <p>&copy; 2026 Unique Boutique. Synced to Facebook & Instagram.</p>
            <a href="tel:7075995811" class="bg-amber-800 hover:bg-amber-900 text-white px-4 py-2 rounded font-bold shadow mt-2 sm:mt-0">Claim a Discovery (Call)</a>
        </div>
    </main>

    <script>
        const items = [
            { title: "Shabby Chic Lace Slip Dress", price: "$48.00", loc: "Sector A - Front Window", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=400" },
            { title: "Bigfoot Tropical Hawaiian Shirt", price: "$36.00", loc: "Sector B - Porch Rack", img: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&q=80&w=400" },
            { title: "7.5L Stoneware Gärtopf Crock", price: "$85.00", loc: "Sector C - Kitchen Vault", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&q=80&w=400" }
        ];

        const container = document.getElementById('mapInventory');
        items.forEach((item, idx) => {
            container.innerHTML += `
                <div class="bg-white p-4 rounded border-2 border-dashed border-stone-500 shadow relative map-pin">
                    <span class="absolute -top-3 left-4 bg-amber-800 text-white text-[10px] px-2 py-0.5 rounded font-bold">Pin #${idx+1}</span>
                    <img src="${item.img}" class="w-full h-36 object-cover rounded mb-2 border border-stone-400">
                    <h3 class="font-bold text-sm text-stone-900">${item.title}</h3>
                    <p class="text-[11px] text-amber-900 font-bold mt-1">${item.loc}</p>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-stone-200">
                        <span class="text-sm font-bold text-red-800">${item.price}</span>
                        <span class="text-[10px] text-blue-800 underline cursor-pointer" onclick="alert('Contact store to claim item!')">Inspect Find</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
