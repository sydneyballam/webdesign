<!DOCTYPE html>
<html lang="en">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        catalogBg: '#F7F5F0',
                        catalogDark: '#141716',
                        catalogGold: '#A3824B',
                        catalogMuted: '#6E7370',
                        catalogLine: '#DCD6CB'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
        :root {
            --paper: #F7F5F0;
            --ink: #141716;
            --gold: #A3824B;
            --muted: #6E7370;
            --line: #DCD6CB;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(ellipse at top, rgba(255,255,255,.05), transparent 55%),
                #1A1D1C;
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        h1, h2, h3, .editorial-serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .catalog-spread {
            position: relative;
            isolation: isolate;
            background: transparent;
            perspective: 2400px;
            transform-style: preserve-3d;
            overflow: visible;
            border-radius: 2px;
        }

        .book-shell {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 640px;
            perspective: 2400px;
            touch-action: pan-y;
        }

        #book {
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0,0,0,.42);
        }

        .page {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid rgba(220,214,203,.8);
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            padding: 2.4rem 2.2rem 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: var(--paper);
        }

        .page-content .page-main {
            margin-top: 1.7rem;
            margin-bottom: 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }

        .page-topline {
            position: absolute;
            top: 1.1rem;
            left: 2.2rem;
            right: 2.2rem;
            font-size: 9px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .page-bottomline {
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            font-size: 9px;
            color: var(--muted);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .page-margin {
            position: absolute;
            z-index: 5;
            top: 0;
            bottom: 0;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            padding: 0;
            color: rgba(163,130,75,.95);
            background: linear-gradient(90deg, rgba(163,130,75,.16), rgba(163,130,75,0));
            cursor: pointer;
            transition: color .2s ease, background .2s ease, width .2s ease;
        }

        .page-margin span {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            letter-spacing: .22em;
            font-size: 9px;
            font-weight: 500;
            opacity: .9;
        }

        .page-margin:hover,
        .page-margin:focus-visible {
            width: 46px;
            color: #fff;
            background: linear-gradient(90deg, rgba(163,130,75,.48), rgba(163,130,75,0));
            outline: 2px solid var(--gold);
            outline-offset: -2px;
        }

        .page-margin:disabled { opacity: .22; cursor: default; }
        .page-margin.prev { left: 0; }
        .page-margin.prev span { transform: rotate(180deg); }
        .page-margin.next { right: 0; background: linear-gradient(270deg, rgba(163,130,75,.16), rgba(163,130,75,0)); }
        .page-margin.next:hover,
        .page-margin.next:focus-visible { background: linear-gradient(270deg, rgba(163,130,75,.48), rgba(163,130,75,0)); }

        .stf__parent { margin: 0 auto; }
        .stf__block { overflow: visible !important; }
        .stf__item { background: var(--paper); }
        .page img { -webkit-user-drag: none; user-select: none; }

        @media (max-width: 1023px) {
            .book-shell { min-height: 540px; }
            .page-content { padding: 2.1rem 1.7rem 1.5rem; }
            .page-topline { left: 1.7rem; right: 1.7rem; }
            .page-margin { width: 30px; }
            .page-margin span { font-size: 8px; }
        }

        @media (max-width: 640px) {
            body { padding-left: 10px !important; padding-right: 10px !important; }
            .book-shell { min-height: 0; padding: 0 3px; }
            .page-content { padding: 2.2rem 1.45rem 1.4rem; }
            .page-topline { left: 1.45rem; right: 1.45rem; font-size: 8px; }
            .page-bottomline { font-size: 8px; letter-spacing: .06em; }
            .page-margin { width: 24px; }
            .page-margin:hover, .page-margin:focus-visible { width: 28px; }
            .page-margin span { letter-spacing: .12em; font-size: 7px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-margin, button { transition-duration: .01ms !important; }
        }
    </style>
</head>

            },
            // SPREAD 3: ITEMS 5 & 6
            {
                leftPageNo: "Page 07",
                rightPageNo: "Page 08",
                left: `

                        <div class="relative h-60 bg-stone-200 rounded-sm overflow-hidden border border-catalogLine shadow-2xs">
                            <img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&q=80&w=800" alt="Vintage flannel shirt" loading="lazy" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-900 text-white text-[9px] uppercase tracking-widest px-2.5 py-1 font-medium">Available</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[9px] uppercase font-semibold tracking-[0.25em] text-catalogGold">Men's Apparel // Item 05</span>
                            <h3 class="editorial-serif text-2xl font-normal text-catalogDark">Men's Heavy Vintage Flannel Utility Shirt</h3>
                            <p class="text-sm font-semibold text-catalogDark">$32.00</p>

                            <a href="tel:7075995811" class="inline-block bg-catalogDark text-white px-4 py-2 rounded-sm text-[10px] uppercase tracking-widest font-medium mt-2 hover:bg-black transition">Inquire to Claim</a>

                `,
                right: `
                    <div class="space-y-5">
                        <div class="relative h-60 bg-stone-200 rounded-sm overflow-hidden border border-catalogLine shadow-2xs">
                            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&q=80&w=800" alt="Rhinestone and pearl necklace" loading="lazy" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-stone-600 text-stone-200 text-[9px] uppercase tracking-widest px-2.5 py-1 font-medium">Archived</span>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[9px] uppercase font-semibold tracking-[0.25em] text-catalogGold">Jewelry & Valuables // Item 06</span>

        const bookEl = document.getElementById('book');
        const indicator = document.getElementById('pageIndicator');
        const prevMargin = document.getElementById('prevMargin');
        const nextMargin = document.getElementById('nextMargin');
        const footerPrev = document.getElementById('footerPrev');
        const footerNext = document.getElementById('footerNext');
        const allPages = [];

        // Convert the editorial spread data into eight individual pages. The page-flip
        // engine bends each page as a canvas-backed sheet and supports corner dragging.
        spreads.forEach((spread, spreadIndex) => {
            const pages = [
                { content: spread.left, number: spread.leftPageNo, side: 'left', spreadIndex },
                { content: spread.right, number: spread.rightPageNo, side: 'right', spreadIndex }
            ];
            pages.forEach(page => {
                const pageEl = document.createElement('div');
                pageEl.className = 'page';
                pageEl.innerHTML = `
                    <div class="page-content">
                        <div class="page-topline" style="text-align:${page.side === 'left' ? 'left' : 'right'}">${page.side === 'left' ? 'From the collection' : 'The collection'}</div>
                        <div class="page-main">${page.content}</div>
                        <div class="page-bottomline">
                            <span>${page.side === 'left' ? 'Unique Boutique Acquisitions' : 'Unique Boutique · Willow Creek'}</span>
                            <span>${page.number}</span>
                        </div>
                    </div>`;
                bookEl.appendChild(pageEl);
                allPages.push(pageEl);
            });
        });

        let pageFlip;
        let currentPage = 0;
        const pageCount = allPages.length;

        function updateNavigation(pageIndex) {
            currentPage = Math.max(0, Math.min(pageIndex, pageCount - 1));
            const first = currentPage % 2 === 0 ? currentPage + 1 : currentPage;
            const second = Math.min(first + 1, pageCount);
            indicator.textContent = `Pages ${String(first).padStart(2, '0')}–${String(second).padStart(2, '0')} of ${String(pageCount).padStart(2, '0')}`;
            const atStart = currentPage <= 0;
            const atEnd = currentPage >= pageCount - 2;
            prevMargin.disabled = atStart;
            footerPrev.disabled = atStart;
            nextMargin.disabled = atEnd;
            footerNext.disabled = atEnd;
            prevMargin.setAttribute('aria-label', atStart ? 'Already at the beginning' : 'Turn to previous page');
            nextMargin.setAttribute('aria-label', atEnd ? 'Already at the end' : 'Turn to next page');
        }

        function previousPage() {
            if (pageFlip && currentPage > 0) pageFlip.flipPrev('top');
        }
        function nextPage() {
            if (pageFlip && currentPage < pageCount - 2) pageFlip.flipNext('top');
        }

        // PageFlip handles the page mesh, curl, reverse side, dynamic shadows,
        // touch/mouse dragging, and the settling animation after a release.
        if (window.St && window.St.PageFlip) {
            pageFlip = new St.PageFlip(bookEl, {
                width: 540,
                height: 680,
                size: 'stretch',
                minWidth: 280,
                maxWidth: 1080,
                minHeight: 360,
                maxHeight: 1360,
                autoSize: true,
                maxShadowOpacity: 0.52,
                showCover: false,
                mobileScrollSupport: true,
                flippingTime: 1050,
                usePortrait: true,
                startPage: 0,
                drawShadow: true,
                startZIndex: 10,
                useMouseEvents: true,
                clickEventForward: true,
                swipeDistance: 30,
                showPageCorners: true,
                disableFlipByClick: false
            });
            pageFlip.loadFromHTML(allPages);
            pageFlip.on('flip', event => updateNavigation(event.data));
            pageFlip.on('changeState', event => {
                bookEl.classList.toggle('is-flipping', event.data === 'flipping');
            });
            updateNavigation(0);
        } else {
            // Graceful fallback if the page-curl library cannot load: display the
            // catalog as a normal paginated stack with simple previous/next controls.
            let fallbackIndex = 0;
            function showFallbackPage() {
                allPages.forEach((page, index) => {
                    page.style.display = index === fallbackIndex || index === fallbackIndex + 1 ? 'block' : 'none';
                    page.style.width = '100%';
                    page.style.height = 'auto';
                    page.style.minHeight = '620px';
                });
                bookEl.style.width = '100%';
                bookEl.style.maxWidth = '700px';
                bookEl.style.display = 'grid';
                bookEl.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
                updateNavigation(fallbackIndex);
            }
            prevMargin.addEventListener('click', () => { fallbackIndex = Math.max(0, fallbackIndex - 2); showFallbackPage(); });
            nextMargin.addEventListener('click', () => { fallbackIndex = Math.min(pageCount - 2, fallbackIndex + 2); showFallbackPage(); });
            footerPrev.addEventListener('click', () => { fallbackIndex = Math.max(0, fallbackIndex - 2); showFallbackPage(); });
            footerNext.addEventListener('click', () => { fallbackIndex = Math.min(pageCount - 2, fallbackIndex + 2); showFallbackPage(); });
            showFallbackPage();
        }

        prevMargin.addEventListener('click', previousPage);
        nextMargin.addEventListener('click', nextPage);
        footerPrev.addEventListener('click', previousPage);
        footerNext.addEventListener('click', nextPage);

        document.addEventListener('keydown', event => {
            if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('a, button, input, textarea, select')) return;
            if (event.key === 'ArrowRight') { event.preventDefault(); nextPage(); }
            else if (event.key === 'ArrowLeft') { event.preventDefault(); previousPage(); }
        });
    </script>

</body>
</html>
